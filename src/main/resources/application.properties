spring.application.name=orderservice

server.port=8082
spring.datasource.url=jdbc:mysql://${DB_HOST}:3306/${DB_NAME}
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.jpa.properties.hibernate.format_sql=true



# ======================
# Kafka Configuration
# ==========================

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS}

# Producer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

#=========actuator prop=========
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
management.metrics.tags.application=${spring.application.name}

#=========restclient============

product-service.base-url=${PRODUCT_SERVICE_BASE_URL}



#=======================jwt configuration======================

jwt.secret=${JWT_SECRET}
jwt.expiration=3600000

#=======================oauth client=======================
spring.security.oauth2.client.registration.keycloak.client-id=orderservice
spring.security.oauth2.client.registration.keycloak.client-secret=${ORDER_SERVICE_CLIENT_SECRET}
spring.security.oauth2.client.registration.keycloak.authorization-grant-type=client_credentials
spring.security.oauth2.client.registration.keycloak.scope=internal:stock:write
spring.security.oauth2.client.provider.keycloak.token-uri=https://auth.shevchaha.online/realms/ecommerce/protocol/openid-connect/token

#=======================Keycloak resource server=======================

spring.security.oauth2.resourceserver.jwt.issuer-uri=https://auth.shevchaha.online/realms/ecommerce